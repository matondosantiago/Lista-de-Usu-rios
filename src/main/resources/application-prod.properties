
# Configuração MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/todolist?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Atualiza ou cria automaticamente as tabelas com base nas entidades (@Entity)
spring.jpa.hibernate.ddl-auto=update

# Opcional: mostra os comandos SQL gerados pelo Hibernate na consola
spring.jpa.show-sql=true